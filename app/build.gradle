plugins {
    id 'com.android.application'
}

android {
    namespace 'com.aziezzembut.rainasmr'
    compileSdk 34

    defaultConfig {
        applicationId "com.aziezzembut.rainasmr"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    // Kunci tetap: supaya APK versi baru bisa langsung menimpa (update) versi lama di HP
    signingConfigs {
        debug {
            storeFile file('berkah-debug.keystore')
            storePassword 'berkah123'
            keyAlias 'berkah'
            keyPassword 'berkah123'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
